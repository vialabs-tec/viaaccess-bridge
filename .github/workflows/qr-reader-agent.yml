# Legacy Raspberry Pi QR agent (Go). New installs use install/qr-reader-firmware
# (ESP32-S3). The tree stays for reference; CI no longer runs on push/PR.
name: QR reader agent

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: install/qr-reader-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: install/qr-reader-agent/go.sum

      - name: go test
        run: go test ./...

      - name: go build
        run: go build -o /dev/null ./cmd/viaaccess-qr-agent
