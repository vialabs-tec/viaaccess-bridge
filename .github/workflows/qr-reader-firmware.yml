name: QR reader firmware

on:
  push:
    branches: [main]
    tags: ["qr-reader-firmware-v*"]
    paths:
      - "install/qr-reader-firmware/**"
      - ".github/workflows/qr-reader-firmware.yml"
  pull_request:
    paths:
      - "install/qr-reader-firmware/**"
      - ".github/workflows/qr-reader-firmware.yml"

# Tag pushes always need contents:write for the GitHub Release. Branch/PR builds
# only upload Actions artifacts.
permissions:
  contents: write

jobs:
  host-tests:
    name: host tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: install/qr-reader-firmware
    steps:
      - uses: actions/checkout@v4

      # The shared logic in components/viaaccess_core builds with the host
      # compiler, so a regression in a passage decision fails here in seconds,
      # before the much slower firmware build starts.
      - name: make -C test/host
        run: make -C test/host

  firmware:
    name: idf.py build
    runs-on: ubuntu-latest
    needs: host-tests
    container: espressif/idf:release-v5.5
    defaults:
      run:
        working-directory: install/qr-reader-firmware
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.value }}
      sha256: ${{ steps.sha.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      # A tag stamps its own version, everything else is a dev build. The value
      # lands in X-ViaAccess-Agent-Version and in /health as agentVersion.
      - name: Resolve firmware version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/qr-reader-firmware-v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/qr-reader-firmware-v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: idf.py build
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py -DVIAACCESS_FIRMWARE_VERSION="${{ steps.version.outputs.value }}" build

      - name: Flash footprint
        run: |
          . "$IDF_PATH/export.sh"
          idf.py size

      - name: App image SHA-256
        id: sha
        run: |
          HASH=$(sha256sum build/viaaccess-qr-firmware.bin | awk '{print $1}')
          mkdir -p dist
          cp build/viaaccess-qr-firmware.bin dist/
          cp build/bootloader/bootloader.bin dist/
          cp build/partition_table/partition-table.bin dist/
          cp build/ota_data_initial.bin dist/
          cp build/flasher_args.json dist/
          echo "${HASH}" > dist/viaaccess-qr-firmware.bin.sha256
          echo "${{ steps.version.outputs.value }}" > dist/VERSION
          echo "value=${HASH}" >> "$GITHUB_OUTPUT"
          echo "viaaccess-qr-firmware.bin sha256=${HASH}"
          echo "Identity BRIDGE_OTA_VERSION=${{ steps.version.outputs.value }}"
          echo "Identity BRIDGE_OTA_SHA256=${HASH}"

      # Flat dist/ so the release job can attach files without nested paths.
      # ota_data_initial.bin points a fresh board at ota_0.
      # The .sha256 sidecar is what Identity BRIDGE_OTA_SHA256 must match.
      - uses: actions/upload-artifact@v4
        with:
          name: qr-reader-firmware-${{ steps.version.outputs.value }}
          path: install/qr-reader-firmware/dist/*
          if-no-files-found: error

  # Publish a GitHub Release only for version tags so Identity can point
  # BRIDGE_OTA_DOWNLOAD_URL at a stable public HTTPS URL (Actions artifacts expire).
  release:
    name: github release
    if: startsWith(github.ref, 'refs/tags/qr-reader-firmware-v')
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qr-reader-firmware-${{ needs.firmware.outputs.version }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QR reader firmware ${{ needs.firmware.outputs.version }}
          body: |
            ESP32-S3 app image for fleet OTA and USB flash.

            ### Identity `BRIDGE_OTA_*`
            ```bash
            BRIDGE_OTA_VERSION=${{ needs.firmware.outputs.version }}
            BRIDGE_OTA_DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/viaaccess-qr-firmware.bin
            BRIDGE_OTA_SHA256=${{ needs.firmware.outputs.sha256 }}
            BRIDGE_OTA_URL_ALLOWLIST=https://github.com/vialabs-tec/
            ```

            Flash (full first install) needs `bootloader.bin`, `partition-table.bin`,
            `ota_data_initial.bin` and the app image — all attached below.
          files: |
            dist/viaaccess-qr-firmware.bin
            dist/viaaccess-qr-firmware.bin.sha256
            dist/VERSION
            dist/bootloader.bin
            dist/partition-table.bin
            dist/ota_data_initial.bin
            dist/flasher_args.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
