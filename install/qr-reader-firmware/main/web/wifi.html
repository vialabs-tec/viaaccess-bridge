<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ViaAccess QR Reader — Rede</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 1.5rem; background: #0b0f14; color: #e8edf2; }
    main { max-width: 32rem; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin-bottom: 0.25rem; }
    p { color: #9aa7b5; font-size: 0.9rem; }
    a { color: #60a5fa; }
    [hidden] { display: none !important; }
    label { display: block; margin-top: 1rem; font-size: 0.85rem; }
    .field-hint { display: block; margin-top: 0.35rem; font-size: 0.75rem; color: #9aa7b5; line-height: 1.4; }
    input, select { width: 100%; margin-top: 0.35rem; padding: 0.55rem 0.65rem; border-radius: 8px; border: 1px solid #2a3441; background: #121820; color: inherit; box-sizing: border-box; }
    button { margin-top: 0; width: 100%; padding: 0.7rem; border: 0; border-radius: 8px; background: #3b82f6; color: white; font-weight: 600; cursor: pointer; }
    button.secondary { background: #0b0f14; border: 1px solid #2a3441; color: #9aa7b5; margin-top: 0.5rem; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .msg { margin-top: 0.85rem; font-size: 0.9rem; }
    .err { color: #f87171; }
    .ok { color: #4ade80; }
    .netbar, .lockbar { margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid #2a3441; background: #121820; font-size: 0.8rem; color: #9aa7b5; line-height: 1.45; }
    .netbar strong, .lockbar strong { color: #e8edf2; font-weight: 600; }
    .netbar.offline { border-color: #7f1d1d; }
    .lockbar { border-color: #92400e; background: #1a1408; color: #fbbf24; }
    .lockbar[hidden] { display: none !important; }
    .actions button[type="submit"]:disabled { opacity: 0.45; cursor: not-allowed; }
    .actions {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #2a3441;
      background: #121820;
    }
    .actions .pin-field,
    .actions .setup-pin-field { margin-top: 0; }
    .actions .pin-field + .setup-pin-field,
    .actions .pin-field + button,
    .actions .setup-pin-field + button { margin-top: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Rede Wi-Fi do leitor</h1>
    <p>
      O leitor precisa de uma rede 2,4 GHz com acesso ao Identity. Escolha a rede, informe a senha
      e aguarde a conexão; depois siga para o provisionamento.
    </p>

    <div id="netbar" class="netbar">Verificando rede…</div>
    <div id="lockbar" class="lockbar" hidden></div>

    <form id="wifi-form">
      <label>Redes encontradas
        <select id="ssid-list"><option value="">Buscando…</option></select>
      </label>
      <label>Nome da rede (SSID)
        <input name="ssid" required autocomplete="off" placeholder="Rede-Portaria" />
      </label>
      <label>Senha
        <input name="password" type="password" autocomplete="off" placeholder="Deixe vazio para rede aberta" />
      </label>
      <div class="actions">
        <label id="pin-field" class="pin-field" hidden>PIN de setup
          <input name="pin" type="password" inputmode="numeric" autocomplete="off" />
        </label>
        <label id="setup-pin-field" class="setup-pin-field" hidden>Definir PIN de setup
          <input name="setupPin" type="password" inputmode="numeric" autocomplete="off"
            placeholder="4 a 8 dígitos" />
          <span class="field-hint">Este leitor ainda não tem PIN. Defina um agora para trocar a rede.</span>
        </label>
        <button type="submit">Conectar</button>
        <button type="button" class="secondary" id="rescan">Buscar redes novamente</button>
        <div id="msg" class="msg"></div>
      </div>
    </form>
  </main>
  <script>
    const netbar = document.getElementById('netbar');
    const lockbar = document.getElementById('lockbar');
    const list = document.getElementById('ssid-list');
    const ssidInput = document.querySelector('input[name="ssid"]');
    const msg = document.getElementById('msg');
    let writesAllowed = true;
    let pinLocked = false;
    let pinLockPoll = null;

    async function refreshStatus() {
      try {
        const res = await fetch('/api/setup');
        const data = await res.json();
        const net = data.network || {};
        writesAllowed = data.setupWritesAllowed !== false;
        const lockSec = Number(data.pinLockRemainingSec || 0);
        pinLocked = lockSec > 0;
        if (pinLocked && !pinLockPoll) {
          pinLockPoll = setInterval(refreshStatus, 1000);
        } else if (!pinLocked && pinLockPoll) {
          clearInterval(pinLockPoll);
          pinLockPoll = null;
        }
        const pinField = document.getElementById('pin-field');
        const setupPinField = document.getElementById('setup-pin-field');
        if (pinField) pinField.hidden = !data.pinRequired || !writesAllowed;
        if (setupPinField) setupPinField.hidden = !data.pinSetupRequired || !writesAllowed;
        const submit = document.querySelector('#wifi-form button[type="submit"]');
        if (submit) submit.disabled = !writesAllowed || pinLocked;
        if (!writesAllowed) {
          lockbar.hidden = false;
          lockbar.innerHTML =
            '<strong>Troca de rede bloqueada nesta conexão.</strong> Três cliques no BOOT, ' +
            'conecte em <code>viaaccess-setup</code>; o login da rede deve abrir o setup. ' +
            'Se não abrir, use <code>http://192.168.4.1/wifi</code>.';
        } else if (pinLocked) {
          lockbar.hidden = false;
          lockbar.innerHTML =
            '<strong>PIN bloqueado.</strong> Cinco tentativas erradas. Aguarde ' +
            lockSec + '&nbsp;s para tentar de novo.';
        } else {
          lockbar.hidden = true;
          lockbar.textContent = '';
        }
        if (net.connected) {
          netbar.className = 'netbar';
          netbar.innerHTML = '<strong>Conectado a</strong> ' + (net.ssid || '—') + ' · IP ' + (net.ip || '—') +
            '<br /><a href="/setup">Ir para o provisionamento</a>';
        } else {
          netbar.className = 'netbar offline';
          netbar.innerHTML = '<strong>Ainda sem conexão.</strong> Rede configurada: ' + (net.ssid || 'nenhuma');
        }
      } catch (err) {
        netbar.className = 'netbar offline';
        netbar.textContent = 'Não foi possível ler o status do leitor.';
      }
    }

    async function scan() {
      list.innerHTML = '<option value="">Buscando…</option>';
      try {
        const res = await fetch('/api/setup/wifi/scan');
        const data = await res.json();
        const networks = data.networks || [];
        if (networks.length === 0) {
          list.innerHTML = '<option value="">Nenhuma rede encontrada</option>';
          return;
        }
        list.innerHTML = '<option value="">Selecione…</option>' + networks
          .map((n) => '<option value="' + n.ssid.replace(/"/g, '&quot;') + '">' +
            n.ssid + ' (' + n.rssi + ' dBm' + (n.secure ? '' : ', aberta') + ')</option>')
          .join('');
      } catch (err) {
        list.innerHTML = '<option value="">Falha ao buscar redes</option>';
      }
    }

    list.addEventListener('change', () => {
      if (list.value) ssidInput.value = list.value;
    });
    document.getElementById('rescan').addEventListener('click', scan);

    document.getElementById('wifi-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = 'msg';
      const fd = new FormData(e.target);
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const res = await fetch('/api/setup/wifi', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pin: fd.get('pin') || '',
            setupPin: fd.get('setupPin') || '',
            ssid: fd.get('ssid'),
            password: fd.get('password') || '',
          }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          msg.textContent = data.error || 'Falha ao salvar a rede.';
          msg.className = 'msg err';
          refreshStatus();
          return;
        }
        // The SoftAP drops as soon as the station associates, so this page may
        // stop responding. That is the success signal for the technician.
        msg.textContent = data.message || 'Credenciais salvas.';
        msg.className = 'msg ok';
      } catch (err) {
        msg.textContent = String(err);
        msg.className = 'msg err';
      } finally {
        btn.disabled = !writesAllowed || pinLocked;
      }
    });

    refreshStatus();
    setInterval(refreshStatus, 4000);
    scan();
  </script>
</body>
</html>
